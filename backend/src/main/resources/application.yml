spring:
  application:
    name: learnink
  profiles:
    default: dev
  jpa:
    open-in-view: false
  jackson:
    default-property-inclusion: non_null

server:
  # Port fourni par l'hébergeur via la variable PORT (sur Vercel : PORT=8080 dans les variables du projet)
  port: ${PORT:8080}
  error:
    include-message: always
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,text/javascript,application/json,image/svg+xml
    min-response-size: 1KB
  # Derrière le proxy HTTPS de l'hébergeur
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

learnink:
  security:
    # Surcharger en production via la variable d'environnement LEARNINK_JWT_SECRET (>= 32 caractères)
    jwt-secret: ${LEARNINK_JWT_SECRET:dev-only-secret-change-me-please-0123456789abcdef}
    jwt-validity: 8h
    allowed-origins: http://localhost:5173
  sandbox:
    # Bases "bac à sable" interrogées par les étudiants (connexions en lecture seule), une par source de données :
    # voir learnink.sandbox.datasources dans les profils dev et mysql
    query-timeout-seconds: 5
    max-compared-rows: 10000
    max-displayed-rows: 200
  # Moteur NoSQL : chaque étudiant renseigne la chaîne de connexion de sa base (cluster Atlas) dans son profil
  mongo:
    # Base utilisée si la chaîne de connexion n'en indique pas
    database: learnink
    # Domaines autorisés pour les bases personnelles, séparés par des virgules
    allowed-hosts: ${LEARNINK_MONGO_ALLOWED_HOSTS:mongodb.net}
    timeout-seconds: 5
    max-clients: 60
    # Connexions ouvertes au plus vers chaque base partagée, par instance (à adapter à l'offre de l'add-on)
    shared-pool-size: ${LEARNINK_MONGO_SHARED_POOL_SIZE:10}
    # Jeu de données de chaque source ; uri = base partagée (chargée au démarrage), utilisée par les étudiants qui n'ont
    # pas renseigné leur propre base, ex. un add-on MongoDB Clever Cloud (sa variable MONGODB_ADDON_URI)
    datasets:
      1:
        name: residence
        uri: ${LEARNINK_MONGO_1_URI:}
      2:
        name: transport
        uri: ${LEARNINK_MONGO_2_URI:}
  seed:
    exercises: true
    demo-users: false
  students:
    # Mot de passe par défaut d'un étudiant (création et réinitialisation) : partie de l'adresse avant « @ » + suffixe,
    # ex. plancelet@ecole.fr → plancelet2026. À changer à la première connexion.
    default-password-suffix: ${LEARNINK_STUDENT_PASSWORD_SUFFIX:2026}
  # Premier compte enseignant, créé au démarrage s'il n'existe pas (mot de passe à changer à la première connexion)
  bootstrap:
    teacher-email: ${LEARNINK_TEACHER_EMAIL:}
    teacher-password: ${LEARNINK_TEACHER_PASSWORD:}
