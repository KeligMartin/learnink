# Profil de production (MySQL 8) : SPRING_PROFILES_ACTIVE=mysql
#
# Avec un add-on MySQL Clever Cloud lié à l'application, aucune variable de base n'est nécessaire :
# MYSQL_ADDON_HOST, _PORT, _DB, _USER et _PASSWORD sont utilisées par défaut (voir learnink.addon).
#
# Base applicative (comptes, exercices, progression)
#   LEARNINK_DB_URL             ex. jdbc:mysql://hote:3306/learnink?sslMode=VERIFY_IDENTITY
#   LEARNINK_DB_USER / LEARNINK_DB_PASSWORD
#   LEARNINK_DB_POOL_SIZE       connexions par instance (défaut 5)
#
# Sources de données (une base bac à sable par jeu de données ; n = 1 ou 2)
#   LEARNINK_SANDBOX_n_URL      ex. jdbc:mysql://hote:3306/learnink_sandbox_1?sslMode=VERIFY_IDENTITY
#                               (source 2 ignorée si LEARNINK_SANDBOX_2_URL est vide)
#   LEARNINK_SANDBOX_n_NAME     libellé affiché à l'enseignant
#   LEARNINK_SANDBOX_n_USER / LEARNINK_SANDBOX_n_PASSWORD
#                               utilisateur des requêtes étudiantes : SELECT uniquement sur cette base
#   LEARNINK_SANDBOX_n_ADMIN_USER / LEARNINK_SANDBOX_n_ADMIN_PASSWORD
#                               utilisateur qui charge les données : propriétaire de cette base
#                               (par défaut : l'utilisateur applicatif, valable seulement si les deux bases sont sur le
#                               même serveur avec le même utilisateur ; à définir avec un add-on Clever Cloud par base)
#   LEARNINK_SANDBOX_n_POOL_SIZE    connexions par instance (défaut 10)
#   LEARNINK_SANDBOX_INIT       if-changed (défaut), always ou never
#
# Divers
#   LEARNINK_JWT_SECRET         secret de signature des jetons (>= 32 caractères)
#   LEARNINK_TEACHER_EMAIL / LEARNINK_TEACHER_PASSWORD   premier compte enseignant
spring:
  datasource:
    url: ${LEARNINK_DB_URL:${learnink.addon.url}}
    username: ${LEARNINK_DB_USER:${learnink.addon.user}}
    password: ${LEARNINK_DB_PASSWORD:${learnink.addon.password}}
    hikari:
      maximum-pool-size: ${LEARNINK_DB_POOL_SIZE:5}
      # Une connexion reste ouverte en permanence ; les autres sont libérées après 30 s d'inactivité
      # (quota de connexions de l'hébergeur). LEARNINK_DB_MIN_IDLE=0 pour n'en garder aucune.
      minimum-idle: ${LEARNINK_DB_MIN_IDLE:1}
      idle-timeout: 30000
  jpa:
    hibernate:
      # Le schéma est créé par les migrations Flyway (db/migration) ; Hibernate se contente de le vérifier
      ddl-auto: validate
  flyway:
    enabled: true

learnink:
  # Add-on MySQL Clever Cloud lié à l'application : ses variables servent de valeurs par défaut à la base applicative
  # et à la source de données 1 (une seule base pour tout : les tables applicatives restent protégées des requêtes
  # étudiantes). Les variables LEARNINK_* ci-dessous restent prioritaires.
  addon:
    url: jdbc:mysql://${MYSQL_ADDON_HOST:localhost}:${MYSQL_ADDON_PORT:3306}/${MYSQL_ADDON_DB:learnink}
    user: ${MYSQL_ADDON_USER:learnink}
    password: ${MYSQL_ADDON_PASSWORD:}
  # Les exercices ne sont rechargés (et leurs solutions vérifiées) que si les fichiers seed/exercises-*.json ont changé
  seed:
    skip-unchanged-exercises: true
  security:
    # Le frontend est servi par l'application elle-même : aucune autre origine n'est autorisée
    allowed-origins: ""
  sandbox:
    # Chaque base n'est rechargée que si son jeu de données a changé (empreinte conservée dans la table sandbox_state)
    init-mode: ${LEARNINK_SANDBOX_INIT:if-changed}
    datasources:
      1:
        name: ${LEARNINK_SANDBOX_1_NAME:Résidence universitaire}
        url: ${LEARNINK_SANDBOX_1_URL:${learnink.addon.url}}
        username: ${LEARNINK_SANDBOX_1_USER:${learnink.addon.user}}
        password: ${LEARNINK_SANDBOX_1_PASSWORD:${learnink.addon.password}}
        admin-username: ${LEARNINK_SANDBOX_1_ADMIN_USER:${spring.datasource.username}}
        admin-password: ${LEARNINK_SANDBOX_1_ADMIN_PASSWORD:${spring.datasource.password}}
        maximum-pool-size: ${LEARNINK_SANDBOX_1_POOL_SIZE:10}
        minimum-idle: ${LEARNINK_SANDBOX_1_MIN_IDLE:1}
        # Garantit que toute colonne du SELECT hors agrégat figure dans le GROUP BY (défaut MySQL 8, imposé au cas où)
        connection-init-sql: SET SESSION sql_mode = CONCAT(@@sql_mode, ',ONLY_FULL_GROUP_BY')
        scripts:
          - classpath:sandbox/residence/reset.sql
          - classpath:sandbox/residence/schema.sql
          - classpath:sandbox/residence/data.sql
      2:
        name: ${LEARNINK_SANDBOX_2_NAME:Source 2}
        url: ${LEARNINK_SANDBOX_2_URL:}
        username: ${LEARNINK_SANDBOX_2_USER:lecteur}
        password: ${LEARNINK_SANDBOX_2_PASSWORD:}
        admin-username: ${LEARNINK_SANDBOX_2_ADMIN_USER:${spring.datasource.username}}
        admin-password: ${LEARNINK_SANDBOX_2_ADMIN_PASSWORD:${spring.datasource.password}}
        maximum-pool-size: ${LEARNINK_SANDBOX_2_POOL_SIZE:10}
        minimum-idle: ${LEARNINK_SANDBOX_2_MIN_IDLE:1}
        connection-init-sql: SET SESSION sql_mode = CONCAT(@@sql_mode, ',ONLY_FULL_GROUP_BY')
        # À compléter avec les scripts du second jeu de données (reset, schema, data)
        scripts: []
